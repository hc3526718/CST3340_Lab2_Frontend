<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactivity Examples</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <div id="div1">
         
        <p> Good morning,  {{fullName}}.</p>
         <p>You have {{unreadEmails}} unread Emails and {{totalEmails}} emails in total. </p>

         <button v-on:click="readEmail()" v-if="canReadEmail">Read an email</button>

         <button v-on:click="getNewEmail()" v-bind:disabled="false"> Get more email</button>
    </div>

      <script type="module">
        const {createApp} = Vue
        const myApp1 = createApp({
            data(){
                return{
                    firstName:"Mark",
                    lastName: "Jones",
                    unreadEmails:5,
                    readEmails:100,
                }
            },
            computed:{
                fullName:function(){
                    return this.firstName + " " + this.lastName;
                },
                totalEmails:function(){
                    return this.unreadEmails + this.readEmails ;
                },
                canReadEmail:function(){
                    return this.unreadEmails > 0;
                }
            },
            methods:{
                readEmail(){
                    this.unreadEmails = this.unreadEmails - 1;
                },
                getNewEmail(){
                    this.unreadEmails = this.unreadEmails + 5;
                }
            }
        })
        myApp1.mount("#div1")
    </script>
    
</body>
</html>
